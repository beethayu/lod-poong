<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- กฎ iOS 26 (จากแอปไร่อ้อย ห้ามเปลี่ยนกลับ): status-bar-style = default, ห้ามมีกล่องเลื่อนได้ใต้แถบสถานะ, ปุ่ม color: inherit · html และ body ต้องสีเดียวกับ theme-color (iOS 26 ใช้สี body ทาแถบสถานะ) พื้นเทาอยู่ที่ #app -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ลดพุง">
  <meta name="theme-color" content="#1E4D45">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>ลดพุง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #1E4D45; --brand-d: #143630; --brand-soft: #E2EEEA;
      --ground: #F3F4F1; --card: #FFFFFF; --line: #E1E3DD; --line2: #CDD0C8;
      --ink: #1B2224; --muted: #5B6466; --faint: #8A9294;
      --ok: #1E7B4D; --warn: #A85E00; --warn-soft: #FDF0DC; --red: #B3261E; --red-soft: #FBE5E3;
      --c-pro: #2a78d6; --c-carb: #c98a00; --c-fat: #eb6834; --c-w: #2a78d6; --c-f: #eb6834;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: #1E4D45; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; background: #1E4D45; height: 100%; overflow: hidden; overscroll-behavior: none;
      font-family: 'IBM Plex Sans Thai', 'Sarabun', system-ui, sans-serif; color: var(--ink); font-size: 16px; line-height: 1.45; }
    #sbar { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #1E4D45; z-index: 3000; pointer-events: none; }
    #app { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; background: var(--ground);
      -webkit-overflow-scrolling: touch; overscroll-behavior: none; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
    #app.chat { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
    html, body { touch-action: manipulation; }
    button:active, .row:active, .chip:active, label.cbtn:active { opacity: .6; }
    .btn.pri:active, .wbtn:active { transform: scale(.97); }
    #syncdot { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 8px; z-index: 3100; font-size: 11px; color: #fff; background: rgba(0,0,0,.25); padding: 2px 8px; border-radius: 99px; display: none; pointer-events: none; }
    button { color: inherit; font-family: inherit; font-size: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px; }

    /* หัว */
    .hd { background: var(--brand); color: #fff; padding: 10px 14px 14px; }
    .hd-in { max-width: 560px; margin: 0 auto; }
    .hd-top { display: flex; align-items: center; gap: 8px; min-height: 36px; }
    .hd-title { font-weight: 700; font-size: 19px; flex: 1; }
    .hd-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,.12); flex: none; }
    .hd-sub { opacity: .8; font-size: 13px; }
    .dnav { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; }
    .dnav b { min-width: 120px; text-align: center; font-weight: 600; }
    .tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .tri > div { background: rgba(255,255,255,.1); border-radius: 12px; padding: 8px 10px; }
    .tri small { display: block; opacity: .8; font-size: 12px; }
    .tri b { font-size: 17px; }
    .seg-dk { display: flex; background: rgba(255,255,255,.12); border-radius: 12px; padding: 3px; gap: 3px; margin-top: 10px; }
    .seg-dk button { flex: 1; height: 36px; border-radius: 9px; font-weight: 600; color: rgba(255,255,255,.85); font-size: 15px; }
    .seg-dk button.on { background: #fff; color: var(--brand); }

    /* วงแหวน */
    .ringbox { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
    .ring { width: 150px; height: 150px; flex: none; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .ring .c b { font-size: 32px; line-height: 1.05; letter-spacing: -.5px; }
    .ring .c small { font-size: 13px; opacity: .85; }
    .eq { flex: 1; font-size: 14px; }
    .eq div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.14); }
    .eq div:last-child { border-bottom: 0; font-weight: 600; }
    .eq span { opacity: .85; }

    /* การ์ด / แถว */
    .sec { margin: 16px 0 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .sec h3 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
    .sec .sm { font-size: 14px; color: var(--muted); font-weight: 600; }
    .lnk { color: var(--brand); font-size: 14px; font-weight: 600; text-decoration: none; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .card.pad { padding: 12px 14px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); width: 100%; text-align: left; min-height: 50px; }
    .row:first-child { border-top: 0; }
    .ico { width: 34px; height: 34px; border-radius: 10px; background: var(--ground); display: grid; place-items: center; font-size: 18px; flex: none; }
    .grow { flex: 1; min-width: 0; }
    .t1 { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t1 small { color: var(--muted); font-weight: 400; font-size: 14px; }
    .t2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .amt { font-weight: 600; white-space: nowrap; text-align: right; }
    .amt small { font-weight: 400; color: var(--muted); font-size: 13px; }
    .empty { padding: 18px 14px; text-align: center; color: var(--muted); font-size: 14px; }
    .acts { display: flex; gap: 8px; padding: 0 12px 12px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 12px;
      font-weight: 600; background: var(--ground); border: 1px solid var(--line); }
    .btn.pri { background: var(--brand); color: #fff; border-color: var(--brand); }
    .btn.red { color: var(--red); background: #fff; }
    .btn.sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
    .btn.full { width: 100%; }
    .btn:disabled { opacity: .55; }
    .mbar { padding: 10px 14px; border-top: 1px solid var(--line); }
    .mbar:first-child { border-top: 0; }
    .mbar .l { display: flex; justify-content: space-between; font-size: 14px; }
    .mbar .l span { color: var(--muted); }
    .bar { height: 8px; background: var(--ground); border-radius: 99px; overflow: hidden; margin-top: 5px; }
    .bar > i { display: block; height: 100%; border-radius: 99px; }
    .alert { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
    .alert.warn { background: var(--warn-soft); color: #6B3C00; }
    .alert.red { background: var(--red-soft); color: var(--red); }
    .alert.info { background: var(--brand-soft); color: var(--brand-d); }
    .tip { display: flex; gap: 10px; padding: 12px 14px; }
    .tip .tx { flex: 1; font-size: 15px; white-space: pre-wrap; }
    .tip .tx.mut { color: var(--muted); }
    .water { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
    .glasses { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .glasses i { width: 14px; height: 18px; border-radius: 2px 2px 4px 4px; border: 1.5px solid #8fb8d8; display: block; }
    .glasses i.on { background: #6fa8d6; border-color: #6fa8d6; }
    .wbtn { width: 46px; height: 46px; border-radius: 12px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 700; flex: none; }
    .wbtn.alt { background: var(--ground); color: var(--muted); border: 1px solid var(--line); width: 38px; }
    .big { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
    .up { color: var(--red); } .down { color: var(--ok); }
    .note { font-size: 13px; color: var(--muted); }

    /* แถบล่าง */
    .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: #fff; border-top: 1px solid var(--line);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); }
    .bnav button { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11.5px; color: var(--faint); padding: 4px 0; }
    .bnav button span { font-size: 21px; line-height: 1.2; filter: grayscale(1); opacity: .75; }
    .bnav button.on { color: var(--brand); font-weight: 600; }
    .bnav button.on span { filter: none; opacity: 1; }
    body.kb .bnav { display: none; }

    /* หน้าต่าง */
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top); z-index: 2000; background: var(--ground); display: none; flex-direction: column; }
    .sheet.on { display: flex; }
    .sh-hd { background: var(--brand); color: #fff; display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex: none; }
    .sh-hd b { flex: 1; font-size: 17px; }
    .sh-bd { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px 14px calc(24px + env(safe-area-inset-bottom)); }
    .sh-bd > * { max-width: 560px; margin-left: auto; margin-right: auto; }
    .sh-ft { flex: none; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); display: flex; gap: 8px; }
    .sh-ft .btn { flex: 1; }

    /* ฟอร์ม */
    .fld { margin-bottom: 12px; }
    .fld > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .inp { width: 100%; height: 44px; border: 1px solid var(--line2); border-radius: 10px; padding: 0 12px; background: #fff; }
    textarea.inp { height: 80px; padding: 10px 12px; }
    .flbl { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 2px 6px; }
    .fcard .frow { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-top: 1px solid var(--line); }
    .fcard .frow:first-child { border-top: 0; }
    .fcard .frow > span { width: 104px; flex: none; color: var(--muted); font-size: 15px; }
    .fcard .frow input { flex: 1; min-width: 0; border: 0; outline: 0; height: 48px; background: transparent; text-align: right; padding: 0; }
    .fcard .frow .sfx { width: auto; color: var(--muted); font-size: 14px; flex: none; }
    .fcard .frow.chk input { flex: none; width: 24px; height: 24px; accent-color: var(--brand); }
    .fcard .frow.chk > span { width: auto; flex: 1; color: var(--ink); }
    .fcard .frow.chk small { display: block; color: var(--muted); font-size: 12.5px; }
    .fcard .frow.tall { display: block; padding: 10px 14px; }
    .fcard .frow.tall > span { display: block; width: auto; margin-bottom: 6px; }
    .fcard textarea { width: 100%; border: 0; outline: 0; background: transparent; resize: none; height: 70px; padding: 0; }
    /* iOS: ช่องวันที่มีความกว้างขั้นต่ำของมันเอง → บังคับให้พอดีช่อง */
    input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; display: block; background: transparent; }
    input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value { text-align: right; margin: 0; }
    .fcard .frow input[type=date], .fcard .frow input[type=time] { height: auto; min-height: 0; line-height: 1.4; padding: 13px 0; }
    .sugg { display: flex; flex-wrap: wrap; gap: 6px; }
    .sugg .chip { height: auto; min-height: 36px; padding: 5px 12px; white-space: normal; text-align: left; }
    .sugg .chip small { color: var(--muted); margin-left: 4px; }
.aibox { margin-top: 10px; }

  .float { position: relative; margin: -42px 0 0; background: #fff; border-radius: 18px; box-shadow: 0 6px 22px rgba(20,54,48,.16); overflow: hidden; }
  .stat3c { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
  .sc { border-radius: 14px; padding: 9px 10px; }
  .sc small { display: block; font-size: 12px; font-weight: 600; opacity: .85; }
  .sc b { font-size: 20px; letter-spacing: -.3px; }
  .sc.eat { background: #FFF1E6; color: #9A4A12; } .sc.ex { background: #F1ECFD; color: #5B3FB0; }
  .sc.left { background: #E3F5EC; color: #17694D; } .sc.over { background: #FDE8E5; color: #B3261E; }
  .sc.blue { background: #EAF3FB; color: #1f5f91; } .sc.orange { background: #FFF1E6; color: #9A4A12; }
  .kbar { height: 8px; border-radius: 99px; background: #EEF0EC; margin: 0 12px 12px; overflow: hidden; display: flex; }
  .kbar i { display: block; height: 100%; }
  /* แถบวัน */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 10px; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0 6px; border-radius: 12px; font-size: 12px; color: rgba(255,255,255,.75); }
  .wd.on { background: rgba(255,255,255,.14); color: #fff; }
  .wd svg { width: 34px; height: 34px; }
  .wd b { font-size: 13px; }
  .wd.fut { opacity: .4; }
  /* การ์ดมื้อ */
  .meal { margin-top: 12px; border-radius: 16px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
  .meal .mh { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .meal .mh .mi { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: rgba(255,255,255,.75); }
  .meal .mh b { flex: 1; font-size: 16px; }
  .meal .mh span { font-weight: 700; font-size: 15px; }
  .meal .mh span small { font-weight: 500; opacity: .75; font-size: 12px; }
  .meal .row { border-top: 1px solid rgba(0,0,0,.05); }
  .meal .addr { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 14px; font-weight: 600; font-size: 14.5px; border-top: 1px solid rgba(0,0,0,.05); }
  .m-breakfast .mh { background: linear-gradient(90deg,#FFF3D6,#FFF9EC); color: #8A5A00; } .m-breakfast .addr { color: #B07400; }
  .m-lunch .mh { background: linear-gradient(90deg,#FFE7D6,#FFF4EC); color: #9A4A12; } .m-lunch .addr { color: #C2581A; }
  .m-dinner .mh { background: linear-gradient(90deg,#E7E8FB,#F3F3FD); color: #3B3F9E; } .m-dinner .addr { color: #4A4FC4; }
  .m-snack .mh { background: linear-gradient(90deg,#FCE4EF,#FDF1F6); color: #9C2F63; } .m-snack .addr { color: #C03D7C; }
  .m-ex .mh { background: linear-gradient(90deg,#EEE8FD,#F7F4FE); color: #5B3FB0; } .m-ex .addr { color: #6B4FD0; }
  .m-water .mh { background: linear-gradient(90deg,#E3F0FB,#F1F8FE); color: #1f5f91; }
  .m-weight .mh { background: linear-gradient(90deg,#E3F5EC,#F1FAF5); color: #17694D; } .m-weight .addr { color: #17694D; }
  .meal .ico { background: #F5F6F3; }
  .wmini { display: flex; align-items: center; gap: 8px; padding: 8px 12px 12px; }
  .wmini .bar { flex: 1; height: 10px; margin: 0; background: #E6EEF6; }
  .wmini .bar i { background: linear-gradient(90deg,#7cc0f0,#3d8fd6); }
  .wsm { height: 38px; padding: 0 12px; border-radius: 10px; background: #EAF3FB; color: #1f5f91; font-weight: 700; font-size: 14px; }
  /* โค้ช */
  .coachhd { display: flex; align-items: center; gap: 10px; }
  .coachhd .av { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg,#7fd8b2,#2f9e78); display: grid; place-items: center; font-size: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .coachhd .st { font-size: 12.5px; opacity: .8; }
  .coachhd .st::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #7CF0B6; margin-right: 5px; vertical-align: 1px; }
  .qchips { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 12px; scrollbar-width: none; }
  .qchips::-webkit-scrollbar { display: none; }
  .qchip { flex: none; height: 36px; padding: 0 13px; border-radius: 99px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .q1 { background: #FFF1E6; color: #9A4A12; } .q2 { background: #E3F5EC; color: #17694D; } .q3 { background: #F1ECFD; color: #5B3FB0; } .q4 { background: #EAF3FB; color: #1f5f91; }
  .cstick { position: sticky; top: 0; z-index: 20; box-shadow: 0 4px 14px rgba(20,54,48,.18); }
  .cstick .hd { padding-bottom: 10px; }
  .cstats { display: flex; gap: 8px; margin-top: 8px; }
  .cstats > div { flex: 1; background: rgba(255,255,255,.13); border-radius: 12px; padding: 6px 11px; font-size: 13px; }
  .cstats > div.over { background: rgba(255,110,90,.32); }
  .cstats small { display: block; font-size: 12px; opacity: .85; }
  .cstats b { font-size: 19px; margin-right: 2px; }
  .cstick .qchips { margin: 10px -14px 0; padding: 0 14px; }
  .msgs2 { padding: 14px 0 8px; display: flex; flex-direction: column; gap: 10px; }
  .mrow { display: flex; gap: 8px; align-items: flex-end; }
  .mrow .mav { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#7fd8b2,#2f9e78); display: grid; place-items: center; font-size: 16px; flex: none; }
  .mrow.u { justify-content: flex-end; }
  .bub { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 15.5px; white-space: pre-wrap; word-wrap: break-word; }
  .mrow.u .bub { background: linear-gradient(135deg,#2f7a6b,#1E4D45); color: #fff; border-bottom-right-radius: 6px; }
  .mrow.m .bub { background: #fff; border: 1px solid #DCEDE4; border-bottom-left-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .bub .at { display: block; font-size: 11px; opacity: .6; margin-top: 2px; text-align: right; }
  .bub .ph { display: block; font-size: 13px; opacity: .9; margin-bottom: 2px; }
  .ec2 { margin-left: 38px; width: calc(86% - 38px); background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid #CFE8DA; box-shadow: 0 2px 8px rgba(23,105,77,.08); }
  .ec2 .eh { background: linear-gradient(90deg,#E3F5EC,#F3FBF7); color: #17694D; font-weight: 700; font-size: 13.5px; padding: 8px 12px; display: flex; justify-content: space-between; }
  .ec2 .row { min-height: 46px; padding: 7px 12px; }
  .ec2 .acts { padding: 6px 12px 10px; }
  .daysep { text-align: center; } .daysep span { display: inline-block; font-size: 12px; color: var(--muted); background: #E8EAE5; padding: 2px 10px; border-radius: 99px; }
  /* ฝึก */
  .actbars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 92px; padding: 0 12px; }
  .actbars div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 11.5px; color: var(--muted); }
  .actbars i { width: 100%; max-width: 28px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg,#A78BFA,#6B4FD0); display: block; }
  .actbars i.zero { background: #EEEBF6; height: 6px !important; }
  .teaser { margin-top: 14px; border-radius: 18px; padding: 16px; color: #fff; background: linear-gradient(135deg,#6B4FD0,#9C6ADE 60%,#C084FC); box-shadow: 0 6px 18px rgba(107,79,208,.3); }
  .teaser b { font-size: 17px; }
  .teaser ul { margin: 8px 0 0; padding-left: 0; list-style: none; font-size: 14.5px; }
  .teaser li { padding: 3px 0; }
  .teaser .tag { display: inline-block; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.22); padding: 2px 9px; border-radius: 99px; margin-bottom: 6px; }
  .exq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .exq button { height: 64px; border-radius: 14px; background: #fff; border: 1px solid #E0D8F7; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600; color: #5B3FB0; }

<script>
// ===== เชื่อมกับ Apps Script =====
const API_URL = 'https://script.google.com/macros/s/AKfycbzh7rtLdGZsLiAxsb4vaAZrMLoRUB5jLt27X9tYF2GRJSmtFwJe61v-JlTqsIXpMc6y/exec';
const KEY_STORE = 'lp_key', DATA_STORE = 'lp_data', UI_STORE = 'lp_ui';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
(function () {
  const m = location.search.match(/[?&]k=([^&]+)/);
  if (m) { lsSet(KEY_STORE, decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.hash); }
})();

// คำขอที่ส่งซ้ำได้ไม่เกิดข้อมูลเบิ้ล → เน็ตหลุดแล้วลองใหม่เองหนึ่งครั้ง
const API_SAFE = ['getAll', 'getTip', 'aiPlan', 'estimateFood', 'getPhoto'];
let apiLive = 0, updWait = false;
function api(fn, args, again) {
  apiLive++;
  return api1(fn, args).finally(() => { apiLive--; if (!apiLive && updWait) setTimeout(checkUpdate, 300); })
    .catch(e => { if (e.net && !again && API_SAFE.indexOf(fn) >= 0) return new Promise(r => setTimeout(r, 1500)).then(() => api(fn, args, true)); throw e; });
}
function api1(fn, args) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), fn === 'coachSend' || fn === 'getTip' ? 150000 : 60000);
  return fetch(API_URL, {
    method: 'POST', redirect: 'follow', signal: ctrl.signal,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], k: lsGet(KEY_STORE) || '' })
  })
    .catch(e => { const x = new Error(e.name === 'AbortError' ? 'หมดเวลาเชื่อมต่อ สัญญาณอาจอ่อน ลองใหม่' : 'เชื่อมต่อไม่ได้ ตรวจสอบเน็ต'); x.net = true; throw x; })
    .then(r => r.json().catch(() => { throw new Error('เซิร์ฟเวอร์ตอบผิดรูปแบบ (สคริปต์อาจยังไม่ได้อนุญาตสิทธิ์)'); }))
    .then(j => {
      if (!j.ok) { const e = new Error(j.error || 'เกิดข้อผิดพลาด'); e.auth = /^AUTH/.test(j.error || ''); e.setup = /^SETUP/.test(j.error || ''); throw e; }
      return j.result;
    })
    .finally(() => clearTimeout(timer));
}
function run(fn, args, msg, after) {
  busy(msg || 'กำลังบันทึก…');
  return api(fn, args).then(d => { busy(false); if (d && d.log) setData(d); if (after) after(d); return d; })
    .catch(e => { busy(false); handleErr(e); throw e; });
}
// ===== บันทึกแบบไม่ต้องรอ: เปลี่ยนจอทันที แล้วส่งเข้าชีตเบื้องหลังทีละคำสั่ง =====
let syncQ = [], syncing = false;
function sync(fn, args, local) {
  if (local) { local(); render(); }
  syncQ.push([fn, args]); pumpSync();
}
function pumpSync() {
  const dot = document.getElementById('syncdot');
  if (syncing) return;
  if (!syncQ.length) { dot.style.display = 'none'; return; }
  syncing = true; dot.style.display = 'block';
  const job = syncQ.shift(), [fn, args] = job;
  api(fn, args).then(d => {
    syncing = false; pumpSync.tries = 0;
    // ใช้ข้อมูลจากชีตเมื่อไม่มีอะไรค้างส่ง (กันจอกระพริบย้อนกลับ)
    if (!syncQ.length && d && d.log && !pending) { const sc = document.getElementById('app').scrollTop; D = Object.assign(d, { tip: d.tip || D.tip }); lsSet(DATA_STORE, JSON.stringify(D)); if (tab !== 'add' && tab !== 'set') { render(); document.getElementById('app').scrollTop = sc; } }
    pumpSync();
  }).catch(e => {
    syncing = false;
    // เน็ตหลุดแวบเดียว: เก็บคำสั่งไว้แล้วลองส่งซ้ำเอง (ทุกคำสั่งส่งซ้ำได้ไม่เบิ้ล — ใช้ id จากฝั่งเว็บ)
    if (e.net && (pumpSync.tries || 0) < 4) {
      pumpSync.tries = (pumpSync.tries || 0) + 1; syncQ.unshift(job);
      dot.textContent = 'สัญญาณหลุด กำลังลองใหม่…';
      setTimeout(() => { dot.textContent = 'กำลังบันทึก…'; pumpSync(); }, [2000, 4000, 8000, 15000][pumpSync.tries - 1]);
      return;
    }
    pumpSync.tries = 0; syncQ = []; dot.style.display = 'none';
    if (e.auth || e.setup) return handleErr(e);
    alert('บันทึกไม่สำเร็จ: ' + e.message + '\nโหลดข้อมูลล่าสุดจากชีตใหม่');
    load(true);
  });
}
function newLogId() { return 'L' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase(); }
function handleErr(e) {
  if (e.auth) return showKeyBox();
  if (e.setup) return showSetup();
  alert(e.message);
}

// ===== สถานะ / ตัวช่วย =====
let D = null, tab = 'today', dDate = '', openRow = '', sumRange = 90, netErr = '';
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_D = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const MEALS = [['breakfast', 'เช้า', '🌅'], ['lunch', 'กลางวัน', '☀️'], ['dinner', 'เย็น', '🌙'], ['snack', 'ของว่าง', '🍪']];
const KIND = { food: ['อาหาร', '🍚'], exercise: ['ออกกำลัง', '🏃'], water: ['น้ำ', '💧'], weight: ['น้ำหนัก', '⚖️'], fast: ['อดอาหาร', '⏱️'] };
const ACT = [[1.2, 'นั่งทำงาน', 'แทบไม่ได้เดิน'], [1.375, 'เดินบ้าง', 'งานยืน/เดินบางช่วง'], [1.55, 'เดินทั้งวัน', 'งานใช้แรงปานกลาง'], [1.725, 'ใช้แรงหนัก', 'งานไร่/ยกของทั้งวัน']];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = x => { const n = Number(String(x == null ? '' : x).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const r1 = n => Math.round(n * 10) / 10;
const fmt = n => Math.round(n).toLocaleString('en-US');
const isTrue = x => x === true || String(x).toUpperCase() === 'TRUE';
function todayIso() { return D && D.today ? D.today : isoOf(new Date()); }
function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(iso, k) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + k); return isoOf(d); }
function dayDiff(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }
function thDate(iso, withDay) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return (withDay ? TH_D[d.getDay()] + ' ' : '') + d.getDate() + ' ' + TH_M[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(2);
}
function dayLabel(iso) {
  const t = todayIso();
  if (iso === t) return 'วันนี้';
  if (iso === addDays(t, -1)) return 'เมื่อวาน';
  return thDate(iso, true);
}
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function mealOf(hm) {
  const [h, m] = String(hm || nowHM()).split(':').map(Number); const x = h + (m || 0) / 60;
  return x >= 4 && x < 10.5 ? 'breakfast' : x < 14.5 && x >= 10.5 ? 'lunch' : x >= 17 && x < 21 ? 'dinner' : 'snack';
}

function setData(d) {
  if (d.needsSetup) { D = d; render(); return showSetup(); }
  D = d;
  lsSet(DATA_STORE, JSON.stringify(d));
  if (!dDate) dDate = d.today;
  render();
}
const S = () => D.settings || {};
const logs = () => D.log || [];
const dayLogs = iso => logs().filter(l => l.date === iso).sort((a, b) => String(a.time) < String(b.time) ? -1 : 1);
// วันที่จดอาหารไม่ครบ (มื้อเดียว หรือต่ำกว่าครึ่งเป้า) — ไม่นับว่ากินน้อย
function partialDay(d, tg) { const f = dayLogs(d).filter(l => l.kind === 'food'), m = {}; f.forEach(l => m[l.meal || l.time] = 1); return f.length > 0 && (Object.keys(m).length < 2 || totals(f).kcal < tg.kcal * 0.5); }
function totals(list) {
  const t = { kcal: 0, protein: 0, carb: 0, fat: 0, ex: 0, exMin: 0, water: 0, n: 0 };
  list.forEach(l => {
    if (l.kind === 'food') { t.kcal += num(l.kcal); t.protein += num(l.protein); t.carb += num(l.carb); t.fat += num(l.fat); t.n++; }
    if (l.kind === 'exercise') { t.ex += num(l.kcal); t.exMin += num(l.minutes); }
    if (l.kind === 'water') t.water += num(l.ml);
  });
  return t;
}
function weights() {
  return logs().filter(l => l.kind === 'weight' && num(l.weight) > 0).sort((a, b) => (a.date + a.time) < (b.date + b.time) ? -1 : 1);
}
// วันละค่า (ค่าล่าสุดของวัน)
function dailyWeights() {
  const m = {};
  weights().forEach(w => { m[w.date] = { date: w.date, w: num(w.weight), f: num(w.fat_pct) || 0 }; });
  return Object.values(m).sort((a, b) => a.date < b.date ? -1 : 1);
}
function latestW() {
  const ws = weights(); if (!ws.length) return null;
  const last = ws[ws.length - 1], lf = ws.filter(w => num(w.fat_pct) > 0).pop();
  return { date: last.date, weight: num(last.weight), fat_pct: lf ? num(lf.fat_pct) : 0, muscle: num(last.muscle) };
}

// ===== ก้าวเดิน / การนอน (ทางลัด Apple Health ← Garmin) =====
const STEP_BASE = 5000, STEP_KCAL_KG = 0.0005;   // ตรงกับ Health.gs
const dailyOf = d => (D.daily || []).find(x => x.date === d) || null;
const hasSteps = x => x && x.steps !== '' && x.steps != null;
function stepInfo(d) {
  const x = dailyOf(d); if (!hasSteps(x)) return null;
  let used = 0;
  dayLogs(d).forEach(l => { if (l.kind !== 'exercise') return; if (/วิ่ง|run/i.test(l.name)) used += num(l.minutes) * 150; else if (/เดิน|walk|hik/i.test(l.name)) used += num(l.minutes) * 110; });
  const steps = num(x.steps), extra = Math.max(0, steps - STEP_BASE - used), w = (latestW() || { weight: 100 }).weight;
  return { steps, used, extra, kcal: Math.round(extra * STEP_KCAL_KG * w / 5) * 5, at: x.steps_at || '' };
}
function stepKcal(d) { const i = stepInfo(d); return i ? i.kcal : 0; }
// ยอดรวมของวัน + แคลจากก้าว (t.step) — โควต้า = เป้า + (ออกกำลัง + ก้าว) ÷ 2
function dayT(d) { const t = totals(dayLogs(d)); t.step = stepKcal(d); return t; }
const exAll = t => t.ex + (t.step || 0);
function sleepTxt(min) { min = Math.round(num(min)); return Math.floor(min / 60) + ' ชม.' + (min % 60 ? ' ' + (min % 60) + ' นาที' : ''); }

// อายุ: มีวันเกิด (Settings.birth YYYY-MM-DD) คิดจากวันนี้ ไม่งั้นใช้ age เดิม (ตรงกับ ageOf_ ใน GAS)
function ageOf(s) {
  const b = String(s.birth || ''); if (!/^\d{4}-\d{2}-\d{2}$/.test(b)) return num(s.age);
  const t = todayIso(); return Number(t.slice(0, 4)) - Number(b.slice(0, 4)) - (t.slice(5) < b.slice(5) ? 1 : 0);
}
// ===== คำนวณเป้า (ตรงกับ calcTarget_ ใน GAS) =====
function calcTarget(s, lw) {
  lw = lw || latestW() || { weight: 100, fat_pct: 0 };
  const w = lw.weight, f = lw.fat_pct;
  const bmr = f > 0 ? 370 + 21.6 * w * (1 - f / 100) : 10 * w + 6.25 * num(s.height || 170) - 5 * (ageOf(s) || 40) + (s.sex === 'female' ? -161 : 5);
  const tdee = bmr * (num(s.activity) || 1.2);
  const rate = num(s.rate) || 2;
  let kcal = tdee - rate * 7700 / 30;
  const low = kcal < bmr;
  if (low) kcal = bmr;
  kcal = Math.round(kcal / 10) * 10;
  const lbm = f > 0 ? w * (1 - f / 100) : num(s.goal_weight || w) * 0.75;
  let protein = Math.round(lbm * 2), fat = Math.round(kcal * 0.25 / 9);
  let carb = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  const auto = { kcal, protein, carb, fat };
  if (!isTrue(s.macro_auto)) { kcal = num(s.kcal) || kcal; protein = num(s.protein) || protein; carb = num(s.carb) || carb; fat = num(s.fat) || fat; }
  // ถึงเป้าเมื่อไร (คิดจากที่ขาดจริงต่อวัน)
  const deficit = tdee - kcal, toLose = w - num(s.goal_weight);
  const days = deficit > 0 && toLose > 0 ? Math.round(toLose * 7700 / deficit) : 0;
  return { kcal, protein, carb, fat, auto, bmr: Math.round(bmr), tdee: Math.round(tdee), low, weight: w, fat_pct: f, deficit: Math.round(deficit), days, toLose: r1(toLose) };
}

function parseTip(t) {

}
// จดอาหารติดกันกี่วัน (นับวันนี้ถ้าจดแล้ว ไม่งั้นนับถึงเมื่อวาน)

  const td = todayIso(), has = d => logs().some(l => l.date === d && l.kind === 'food');
  let d = has(td) ? td : addDays(td, -1), n = 0;
  while (has(d) && n < 999) { n++; d = addDays(d, -1); }
  return n;
}
function proteinDays(tg) {
  let hit = 0, seen = 0;
  for (let i = 1; i <= 7; i++) { const d = addDays(todayIso(), -i), t = totals(dayLogs(d)); if (t.n && !partialDay(d, tg)) { seen++; if (t.protein >= tg.protein * 0.9) hit++; } }
  return { hit, seen };
}

// เตือนแบบไม่ใช้ AI
function alertsHtml(tg) {
  const out = [], td = todayIso(), dw = dailyWeights();
  // น้ำหนักนิ่ง 3 อาทิตย์: ค่าเฉลี่ย 7 วันล่าสุด เทียบ 21 วันก่อน
  if (dw.length >= 4 && dayDiff(dw[0].date, td) >= 24) {
    const avg = (a, b) => { const x = dw.filter(w => w.date > a && w.date <= b); return x.length ? x.reduce((s, w) => s + w.w, 0) / x.length : null; };
    const now = avg(addDays(td, -7), td), then = avg(addDays(td, -28), addDays(td, -21));
    if (now != null && then != null && then - now < 0.3) out.push(`<div class="alert warn">⚖️ น้ำหนักแทบไม่ลง 3 อาทิตย์ (${r1(then)} → ${r1(now)}) — ลองลดวันละ ~150 แคล หรือเดินเพิ่มวันละ 20–30 นาที</div>`);
  }
  // กินต่ำกว่าเป้ามากหลายวัน
  let low = 0, seen = 0;
  for (let i = 1; i <= 4; i++) { const t = totals(dayLogs(addDays(td, -i))); if (t.n && !partialDay(addDays(td, -i), tg)) { seen++; if (t.kcal < tg.kcal - 500) low++; } }
  if (seen >= 3 && low >= 3) out.push(`<div class="alert red">🍽️ ${low} วันล่าสุดกินต่ำกว่าเป้าเกิน 500 แคล — กินให้พอเป้า ไม่งั้นกล้ามหายและเผาผลาญลดลง</div>`);
  return out.join('');
}

function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('เปิดรูปไม่ได้')); };
    img.src = url;
  });
}

// ---------- สรุป ----------
function sumHtml() {
  const s = S(), tg = calcTarget(s), td = todayIso();
  const from = sumRange ? addDays(td, -sumRange + 1) : '0000';
  const dw = dailyWeights(), dwr = dw.filter(w => w.date >= from);
  const first = dw[0], lw = latestW(), g = num(s.goal_weight);
  const lost = first && lw ? r1(first.w - lw.weight) : 0;
  const span = first ? first.w - g : 0, pct = span > 0 && lw ? Math.max(0, Math.min(1, (first.w - lw.weight) / span)) : 0;
  const days = []; for (let i = 13; i >= 0; i--) { const d = addDays(td, -i); const t = dayT(d); t.ex = exAll(t); days.push({ d, ...t }); }
  const wk = [], mon = addDays(td, -((new Date(td + 'T12:00:00').getDay() + 6) % 7));
  for (let i = 0; i < 6; i++) {
    const a = addDays(mon, -7 * i), b = addDays(a, 6), dd = [];
    for (let k = 0; k < 7; k++) { const d = addDays(a, k); if (d > td) break; const t = totals(dayLogs(d)); if (t.n) dd.push(t); }
    const ws = dw.filter(w => w.date >= a && w.date <= b);
    wk.push({ a, n: dd.length, kcal: dd.length ? dd.reduce((s, t) => s + t.kcal, 0) / dd.length : 0, pro: dd.length ? dd.reduce((s, t) => s + t.protein, 0) / dd.length : 0, w: ws.length ? ws.reduce((s, x) => s + x.w, 0) / ws.length : 0 });
  }
  return `<div class="hd tall"><div class="hd-in"><div class="hd-top"><div class="hd-title">📊 สรุป</div></div>
      <div class="seg-dk">${[[30, '30 วัน'], [90, '90 วัน'], [0, 'ทั้งหมด']].map(([v, n]) => `<button class="${sumRange === v ? 'on' : ''}" onclick="sumRange=${v};render()">${n}</button>`).join('')}</div></div></div>
    <div class="wrap">
      <div class="float"><div class="big2"><b>−${lost > 0 ? lost : 0} กก.</b><span>ลดไปแล้ว ตั้งแต่ ${first ? thDate(first.date) : '-'}</span></div>
        <div class="coach" style="margin:0;box-shadow:none;border-radius:0;background:none"><div class="goal" style="background:none;border:0"><div class="gl"><span>เริ่ม ${first ? first.w : '-'}</span><b>ล่าสุด ${lw ? lw.weight : '-'} · ${Math.round(pct * 100)}%</b><span>เป้า ${g}</span></div>
          <div class="gbar"><i style="width:${pct * 100}%"></i><em style="left:${pct * 100}%"></em></div>
          <div class="gl"><span>เหลือ ${lw ? Math.max(0, r1(lw.weight - g)) : '-'} กก.</span><span>${tg.days ? 'ถึงเป้าราว ' + thDate(addDays(td, tg.days)) : ''}</span></div></div></div></div>
      <div class="ccard c-w"><div class="ch"><div class="mi">⚖️</div><b>น้ำหนัก</b><span>เส้น = เฉลี่ย 7 วัน</span></div>
        <div class="chart">${lineChart('cw', dwr, 'w', 'var(--c-w)', '#9cc0ea', g)}<div class="ctip" id="cw_tip">แตะกราฟเพื่อดูค่า</div></div></div>
      <div class="ccard c-f"><div class="ch"><div class="mi">🔥</div><b>% ไขมัน</b><span>${lw && lw.fat_pct ? 'ล่าสุด ' + lw.fat_pct + '%' : ''}</span></div>
        <div class="chart">${dwr.filter(w => w.f).length ? lineChart('cf', dwr.filter(w => w.f), 'f', 'var(--c-f)', '#f4b596') + '<div class="ctip" id="cf_tip"></div>' : '<div class="empty">ยังไม่มีข้อมูล % ไขมัน</div>'}</div></div>
      <div class="ccard c-k"><div class="ch"><div class="mi">🍽️</div><b>แคลอรี่ 14 วัน</b><span>เป้า ${fmt(tg.kcal)}</span></div>
        <div class="chart">${kcalChart(days, tg)}<div class="ctip" id="ck_tip">แตะแท่งเพื่อดูตัวเลข</div></div></div>
      ${stepCharts(td)}
      <div class="ccard c-t"><div class="ch"><div class="mi">📅</div><b>รายสัปดาห์</b><span>เฉลี่ยต่อวันที่จด</span></div>
        <table class="tbl"><tr><th>สัปดาห์</th><th>แคล</th><th>โปรตีน</th><th>น้ำหนัก</th></tr>
        ${wk.map((w, i) => { const nw = wk[i + 1]; const dlt = w.w && nw && nw.w ? r1(w.w - nw.w) : null;
          return `<tr><td>${thDate(w.a).replace(/ \d+$/, '')}${w.a === mon ? ' (นี้)' : ''}</td><td class="${w.n ? (w.kcal > tg.kcal + 100 ? 'r' : 'g') : ''}">${w.n ? fmt(w.kcal) : '-'}</td>
            <td class="${w.n ? (w.pro >= tg.protein * 0.9 ? 'g' : '') : ''}">${w.n ? fmt(w.pro) + ' ก.' : '-'}</td><td>${w.w ? r1(w.w) : '-'}${dlt != null ? ` <small class="${dlt <= 0 ? 'down' : 'up'}">${dlt > 0 ? '+' : ''}${dlt}</small>` : ''}</td></tr>`; }).join('')}</table></div>
      <p class="note" style="margin:10px 2px">เป้าต่อวัน ${fmt(tg.kcal)} แคล · โปรตีน ${tg.protein} คาร์บ ${tg.carb} ไขมัน ${tg.fat} ก. · BMR ${fmt(tg.bmr)} · TDEE ${fmt(tg.tdee)}</p>
    </div>`;
}

function startWorkout(di) {
  const day = plan().days[di];
  W = { day_idx: di, name: day.name, start: Date.now(), date: todayIso(), items: day.items.map(it => {
    const last = exSessions(it)[0];
    return { ex_id: it.id, ex_name: exName(it), lo: it.lo, hi: it.hi, kg: num(it.kg), feel: '',
      sets: Array.from({ length: it.sets }, (_, i) => { const l = last && last.sets.find(x => Number(x.set_no) === i + 1); return { reps: it.hi, kg: num(it.kg), done: false, prev: l ? num(l.reps) : null }; }) };
  }) };
  saveW(); go('train');
}
function workoutHtml() {

      return `<div class="wex ${allDone ? 'fin' : ''}"><div class="wexh">${exThumb(x)}<div class="grow"><div class="t1">${ii + 1}. ${esc(exName(it))}</div>
          <div class="t2">เป้า ${it.lo}–${it.hi} ${u}${it.kg ? ' · ' + it.kg + ' กก.' : ''} · ${lastTxt({ id: it.ex_id, name: it.ex_name })}</div></div>
          <button class="lnk" onclick="exOpen=exOpen==='${ii}'?'':'${ii}';keepScroll()">${exOpen === String(ii) ? 'ปิด' : 'วิธีทำ'}</button></div>
        ${exOpen === String(ii) ? `<div class="how">${exPics(x)}${esc(x.how || '-')}</div>` : ''}
        <div class="circles">${it.sets.map((s, si) => `<button class="cir ${s.done ? 'on' : ''} ${setOpen === ii + '-' + si ? 'sel' : ''}" onclick="tapSet(${ii},${si})"><b>${s.reps}</b><small>${s.done ? (s.kg ? s.kg + 'กก.' : u) : 'เซ็ต ' + (si + 1)}</small></button>`).join('')}

}
function setEditor(ii, si) {
  const s = W.items[ii].sets[si], x = exOf(W.items[ii].ex_id) || {};
  const st = (lbl, key, step, unit) => `<div class="stp"><span>${lbl}</span><button onclick="adjSet(${ii},${si},'${key}',-${step})">−</button><b>${s[key]}</b><button onclick="adjSet(${ii},${si},'${key}',${step})">＋</button><span class="t2">${unit}</span></div>`;
  return `<div class="seted">${st('ทำได้', 'reps', 1, unitTxt(x))}${(s.kg || x.eq === 'db' || x.eq === 'gym') ? st('น้ำหนัก', 'kg', x.eq === 'gym' ? 2.5 : 1, 'กก.') : ''}
    <div style="display:flex;gap:8px;margin-top:6px">${s.done ? `<button class="btn sm" onclick="W.items[${ii}].sets[${si}].done=false;setOpen='';saveW();keepScroll()">ยังไม่เสร็จ</button>` : ''}

function tapSet(ii, si) {
  const s = W.items[ii].sets[si];
  if (!s.done) { s.done = true; setOpen = ''; saveW(); keepScroll(); startRest(W.items[ii].kg ? 90 : (num(S().rest) || 60)); }
  else { setOpen = setOpen === ii + '-' + si ? '' : ii + '-' + si; keepScroll(); }
}
function adjSet(ii, si, k, d) { const s = W.items[ii].sets[si]; s[k] = Math.max(0, r1(num(s[k]) + d)); saveW(); keepScroll(); }
function addSet(ii) { const it = W.items[ii], l = it.sets[it.sets.length - 1] || { reps: it.hi, kg: it.kg }; it.sets.push({ reps: l.reps, kg: l.kg, done: false }); saveW(); keepScroll(); }
function cancelWorkout() { if (!confirm('ยกเลิกการฝึกนี้? (ไม่บันทึก)')) return; W = null; saveW(); stopRest(); render(); }
function finishWorkout() {
  const n = W.items.reduce((s, it) => s + it.sets.filter(x => x.done).length, 0);

    items: W.items.map(it => ({ ex_id: it.ex_id, ex_name: it.ex_name, feel: it.feel, sets: it.sets.filter(x => x.done).map(x => ({ reps: x.reps, kg: x.kg })) })).filter(it => it.sets.length) };
  // โชว์ผลทันที

  payload.items.forEach(it => it.sets.forEach((x, i) => (D.sets = D.sets || []).push({ set_id: sid + i, date: payload.date, session_id: sid, day_idx: payload.day_idx, ex_id: it.ex_id, ex_name: it.ex_name, set_no: i + 1, reps: x.reps, kg: x.kg, feel: i === it.sets.length - 1 ? it.feel : '', created_at: nowStr() })));
  W = null; saveW(); stopRest(); pickDay = -1;
  sync('saveWorkout', [payload]);
  toast(`🎉 จบการฝึก ${n} เซ็ต ${payload.minutes} นาที`);
}
function nowStr() { return todayIso() + ' ' + nowHM() + ':00'; }

let restEnd = 0, restT = 0;
function startRest(sec) { restEnd = Date.now() + sec * 1000; clearInterval(restT); restT = setInterval(tickRest, 250); tickRest(); }
function stopRest() { clearInterval(restT); restEnd = 0; const b = document.getElementById('restbar'); if (b) b.style.display = 'none'; }
function tickRest() {
  const b = document.getElementById('restbar'), left = Math.ceil((restEnd - Date.now()) / 1000);
  if (left <= 0) { stopRest(); toast('⏰ หมดเวลาพัก ไปเซ็ตต่อไป'); try { navigator.vibrate && navigator.vibrate(300); } catch (e) {} return; }
  b.style.display = 'flex';
  document.getElementById('restT').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
}

const clonePlan = () => JSON.parse(JSON.stringify(plan() || { days: [] }));
function adjPlan(di, ii, k, d) { const p = clonePlan(), it = p.days[di].items[ii]; it[k] = Math.max(k === 'kg' ? 0 : 1, r1(num(it[k]) + d)); if (it.lo > it.hi) { if (k === 'lo') it.hi = it.lo; else it.lo = it.hi; } savePlan(p); }

const CH = {};
function lineChart(id, pts, key, color, dotColor, goal) {
  if (!pts.length) return '<div class="empty">ยังไม่มีข้อมูล</div>';
  const W = 360, H = 190, L = 34, R = 10, T = 10, B = 24;
  const t0 = new Date(pts[0].date + 'T12:00:00').getTime(), t1 = new Date(pts[pts.length - 1].date + 'T12:00:00').getTime();
  const span = Math.max(1, t1 - t0);
  // เฉลี่ย 7 วัน (ย้อนหลังตามวันที่)
  const avg = pts.map(p => { const a = addDays(p.date, -6), x = pts.filter(q => q.date >= a && q.date <= p.date); return x.reduce((s, q) => s + q[key], 0) / x.length; });
  let lo = Math.min(...pts.map(p => p[key])), hi = Math.max(...pts.map(p => p[key]));
  if (goal && goal > lo - 3) lo = Math.min(lo, goal);
  if (hi - lo < 2) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const X = d => L + (pts.length === 1 ? (W - L - R) / 2 : (new Date(d + 'T12:00:00').getTime() - t0) / span * (W - L - R));
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = (hi - lo) / 4;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = lo + step * i; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6E8E3"/><text x="${L - 5}" y="${Y(v) + 4}" font-size="10.5" text-anchor="end" fill="#8A9294">${r1(v)}</text>`; }
  const ticks = [pts[0], pts[Math.floor(pts.length / 2)], pts[pts.length - 1]].filter((p, i, a) => a.indexOf(p) === i);
  g += ticks.map((p, i) => `<text x="${X(p.date)}" y="${H - 6}" font-size="10.5" text-anchor="${pts.length === 1 ? 'middle' : i === 0 ? 'start' : i === ticks.length - 1 ? 'end' : 'middle'}" fill="#8A9294">${thDate(p.date).replace(/ \d+$/, '')}</text>`).join('');
  if (goal && goal >= lo && goal <= hi) g += `<line x1="${L}" x2="${W - R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#5B6466" stroke-dasharray="4 4"/>`;
  g += pts.map(p => `<circle cx="${X(p.date)}" cy="${Y(p[key])}" r="2.8" fill="${dotColor}"/>`).join('');
  if (pts.length > 1) g += `<polyline points="${pts.map((p, i) => X(p.date).toFixed(1) + ',' + Y(avg[i]).toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  CH[id] = { pts, avg, key, X, L, W, R };
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;touch-action:pan-y" onpointerdown="chTip('${id}',event)" onpointermove="chTip('${id}',event)">${g}<line id="${id}_cur" y1="${T}" y2="${H - B}" stroke="#1B2224" stroke-width="1" style="display:none"/></svg>`;
}
function chTip(id, ev) {
  const c = CH[id]; if (!c) return;
  const svg = ev.currentTarget, rect = svg.getBoundingClientRect(), x = (ev.clientX - rect.left) / rect.width * c.W;
  let bi = 0, bd = 1e9; c.pts.forEach((p, i) => { const d = Math.abs(c.X(p.date) - x); if (d < bd) { bd = d; bi = i; } });
  const p = c.pts[bi], cur = document.getElementById(id + '_cur');
  cur.setAttribute('x1', c.X(p.date)); cur.setAttribute('x2', c.X(p.date)); cur.style.display = '';
  document.getElementById(id + '_tip').innerHTML = `<b>${thDate(p.date, true)}</b> · ${p[c.key]}${c.key === 'f' ? '%' : ' กก.'} · เฉลี่ย 7 วัน <b>${r1(c.avg[bi])}</b>`;
}
function kcalChart(days, tg) {
  const W = 360, H = 170, L = 34, R = 6, T = 10, B = 22;

  const bw = (W - L - R) / days.length;

  let g = '';

  days.forEach((d, i) => {

function barChart(id, pts, goal, color, lab, unit) {

  let g = '';
  [0, 0.5, 1].forEach(f => { const v = hi * f; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6E8E3"/><text x="${L - 5}" y="${Y(v) + 4}" font-size="10.5" text-anchor="end" fill="#8A9294">${lab(v)}</text>`; });

  });

function saveSet() {
  document.querySelectorAll('#app input').forEach(el => el.blur());
  const o = Object.assign({}, SS);
  ['goal_weight', 'height', 'age', 'water_goal', 'step_goal', 'kcal', 'protein', 'carb', 'fat'].forEach(k => o[k] = o[k] === '' ? '' : num(o[k]));
  o.rate = num(o.rate); o.activity = num(o.activity); o.macro_auto = isTrue(o.macro_auto);
  if (!o.goal_weight) return alert('ใส่น้ำหนักเป้า');
  sync('saveSettings', [o], () => { D.settings = Object.assign({}, D.settings, o); SS = null; tab = 'today'; });
  document.getElementById('app').scrollTop = 0;
  toast('บันทึกแล้ว');
}
function copyTxt(t, el) {
  const done = () => { toast('ก๊อปแล้ว'); if (el) { el.textContent = '✓ ก๊อปแล้ว'; setTimeout(() => el.textContent = 'ก๊อป', 1600); } };
  try { navigator.clipboard.writeText(t).then(done, () => { prompt('ก๊อปข้อความนี้', t); }); } catch (e) { prompt('ก๊อปข้อความนี้', t); }
}
function cpy(label, t) { return `<span class="cprow"><span class="code">${esc(t)}</span><button class="btn sm" onclick="copyTxt('${esc(t).replace(/'/g, '&#39;')}',this)">ก๊อป</button></span>`; }
function hkStatus() {
  const ws = weights().filter(w => w.source === 'shortcut').pop(), dl = (D.daily || []).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const st = dl.filter(x => hasSteps(x)).pop(), sl = dl.filter(x => num(x.sleep_min) > 0).pop(), wo = logs().filter(l => l.source === 'health').sort((a, b) => a.date < b.date ? -1 : 1).pop();
  const r = (ic, n, v) => `<div class="hkst"><span>${ic} ${n}</span><b class="${v ? '' : 'no'}">${v || 'ยังไม่มี'}</b></div>`;
  return `<div class="card hkcard"><div class="t2" style="padding:10px 12px 2px;font-weight:600">ข้อมูลล่าสุดที่เข้าแอป</div>
    ${r('⚖️', 'น้ำหนัก', ws ? thDate(ws.date) + ' · ' + num(ws.weight) + ' กก.' : '')}
    ${r('👣', 'ก้าว', st ? dayLabel(st.date) + (st.steps_at ? ' ' + st.steps_at : '') + ' · ' + fmt(num(st.steps)) : '')}
    ${r('😴', 'การนอน', sl ? dayLabel(sl.date) + ' · ' + sleepTxt(sl.sleep_min) : '')}
    ${r('⌚', 'ออกกำลังจากนาฬิกา', wo ? dayLabel(wo.date) + ' · ' + esc(wo.name.replace('นาฬิกา: ', '')) : '')}
    ${hkLast()}</div>`;
}
function hkLast() {
  const h = (D.settings || {}).hk_last; if (!h || !h.at) return '';
  const vals = Object.keys(h.vals || {}).map(k => esc(k) + ' ' + h.vals[k]).join(' · ');
  return `<div class="hkst" style="display:block;font-size:12.5px;color:var(--t2,#6B7375)">ทางลัดส่งมาล่าสุด ${esc(String(h.at).slice(5))} · น้ำหนัก ${h.w || 0} · ก้าว ${h.s || 0} · นอน ${h.n || 0} · ออกกำลัง ${h.o || 0} บรรทัด
    ${h.n ? '<br>ค่าการนอน: ' + vals : (h.s ? '<br>⚠️ ไม่มีบรรทัดการนอนเลย — Garmin ยังไม่ส่งเข้าแอปสุขภาพ หรือทางลัดส่วนนอนไม่ทำงาน' : '')}
    ${h.n && (h.ex || [])[0] ? '<br><span style="word-break:break-all">' + esc(h.ex[0]) + '</span>' : ''}</div>`;
}

    <ol class="steps">

      <li><b>น้ำหนัก</b>: เพิ่ม <b>ค้นหาตัวอย่างสุขภาพ</b> → ประเภท <b>น้ำหนัก</b> · หน่วย <b>กก.</b> · ตัวกรอง วันที่เริ่ม อยู่ใน <b>14 วันล่าสุด</b> (ครั้งแรกลบตัวกรอง = ส่งย้อนหลังทั้งหมด)<br>${rep('w', iso('วันที่เริ่ม') + ' เว้นวรรค แทรก <b>รายการที่ทำซ้ำ › ค่า</b>')}</li>
      <li><b>% ไขมัน</b>: ทำเหมือนข้อ 2 ประเภท <b>เปอร์เซ็นต์ไขมันในร่างกาย</b> (ระวัง: ไม่ใช่ "ไขมันทั้งหมด" ที่เป็นไขมันจากอาหาร) ใช้ <code>f</code> แทน <code>w</code></li>

      <li><b>การนอน</b>: ประเภท <b>การวิเคราะห์การนอนหลับ</b> · <b>3 วันล่าสุด</b><br>${rep('n', iso('วันที่เริ่ม') + ' เว้นวรรค ' + iso('วันที่สิ้นสุด') + ' เว้นวรรค แทรก <b>ค่า</b>')}</li>
      <li><b>ออกกำลังจากนาฬิกา</b> (ถ้าในรายการประเภทมี <b>การออกกำลังกาย</b> — ไม่มีข้ามได้): 3 วันล่าสุด<br>${rep('o', iso('วันที่เริ่ม') + ' เว้นวรรค ' + iso('วันที่สิ้นสุด') + ' เว้นวรรค แทรก <b>ประเภท</b>')}</li>
      <li>นอกทำซ้ำทั้งหมด เพิ่ม <b>URL</b> วาง ${cpy('', API_URL)} แล้วต่อด้วย <b>รับเนื้อหาของ URL</b> แตะ ⌄ ขยาย
        วิธีการ <b>POST</b> · ขอเนื้อหา <b>JSON</b> เพิ่ม 3 ช่องแบบ <b>ข้อความ</b>:<br>
        <code>fn</code> = ${cpy('', 'importHealth')}<code>k</code> = ${k ? cpy('', k) : '<span class="code">(รหัสเข้าแอป)</span>'}<code>args</code> = แทรกตัวแปร <b>ข้อมูล</b></li>
      <li>เพิ่ม <b>แสดงการแจ้งเตือน</b> → แทรก <b>เนื้อหาของ URL</b> แล้วกด ▶ รัน (ครั้งแรกกดอนุญาตสุขภาพ) → ขึ้น "ลดพุง: น้ำหนัก +… · ก้าว … วัน · นอน … คืน" แล้วกล่องด้านบนจะเปลี่ยน<br><span class="t2">ผ่านแล้วลบขั้นแจ้งเตือนทิ้งได้ จะได้ไม่เด้งทุกรอบ</span></li>
    </ol>
    <div class="flbl">ให้ส่งเอง (ระบบอัตโนมัติ)</div>
    <ol class="steps">
      <li>แท็บ <b>ระบบอัตโนมัติ</b> → ＋ → <b>เวลาของวัน</b> 08:00 ทุกวัน → <b>เรียกใช้ทันที</b> · ปิด <b>แจ้งเตือนเมื่อเรียกใช้</b> → เลือกทางลัดนี้</li>
      <li>ทำซ้ำอีก 3 อัน: <b>12:00 · 16:00 · 20:00</b></li>
      <li>＋ → <b>แอป</b> → เลือก <b>Garmin Connect</b> → ติ๊ก <b>ถูกปิด</b> (เอา ถูกเปิด ออก) → เรียกใช้ทันที → ทางลัดนี้</li>
    </ol>
    <p class="note">อยากเห็นก้าวล่าสุด: เปิด Garmin Connect รอซิงก์ 5–10 วิ แล้วปัดปิด ทางลัดจะส่งเข้าแอปเอง · เครื่องชั่งขึ้น "ยังไม่ได้เชื่อมเกตเวย์ Bluetooth Mesh" ให้เปิด Xiaomi Home ใกล้เครื่องชั่งตอนชั่ง</p>`);
}

// ---------- ตั้งค่าครั้งแรก / รหัส ----------
function openSheet(title, body, foot) {
  document.getElementById('shTitle').textContent = title;
  document.getElementById('shBody').innerHTML = body;
  const f = document.getElementById('shFoot'); f.innerHTML = foot || ''; f.style.display = foot ? 'flex' : 'none';
  document.getElementById('sheet').classList.add('on');
  document.getElementById('shBody').scrollTop = 0;
}
function closeSheet() { document.getElementById('sheet').classList.remove('on'); }
function busy(msg) { const b = document.getElementById('busy'); if (msg) { document.getElementById('busyMsg').textContent = msg; b.style.display = 'grid'; } else b.style.display = 'none'; }
let toastT = 0;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2600); }
function showKeyBox() {
  openSheet('ใส่รหัสเข้าแอป', `<div class="fld"><label>รหัสเข้าแอป</label><input class="inp" id="keyIn" type="password" autocomplete="current-password"></div>`,
    `<button class="btn pri" onclick="lsSet(KEY_STORE,document.getElementById('keyIn').value.trim());closeSheet();load(true)">เข้าใช้</button>`);
}
function showSetup() {
  openSheet('เริ่มใช้ลดพุง', `<div class="alert info" style="margin-top:0">ตั้งครั้งเดียว ข้อมูลเก็บใน Google Sheets "ลดพุง" ของบัญชี bee.prettyboy</div>
    <div class="fld"><label>ตั้งรหัสเข้าแอป (จำไว้ ใช้ตอนเปิดในเครื่องใหม่)</label><input class="inp" id="suKey" autocomplete="new-password"></div>
    <div class="fld"><label>รหัส Gemini (โค้ช AI) — ใส่ทีหลังได้</label><input class="inp" id="suGem" placeholder="AQ.… หรือ AIza…"></div>
    <p class="note">ใช้ตัวเดียวกับแอปเก็บตังค์: Apps Script เก็บตังค์ → ⚙️ ตั้งค่าโปรเจกต์ → คุณสมบัติของสคริปต์ → GEMINI_KEY</p>`,
    `<button class="btn pri" onclick="doSetup()">เริ่มใช้</button>`);
}
function doSetup() {
  const k = document.getElementById('suKey').value.trim(), g = document.getElementById('suGem').value.trim();
  if (k.length < 4) return alert('รหัสอย่างน้อย 4 ตัว');
  lsSet(KEY_STORE, k);
  run('initSetup', [k, g], 'กำลังสร้างชีต…', () => { closeSheet(); toast('พร้อมใช้แล้ว'); });
}
function openGemini() {
  openSheet('รหัส Gemini', `<div class="fld"><label>วางรหัส (ขึ้นต้น AQ. หรือ AIza)</label><input class="inp" id="gIn"></div>
    <p class="note">ตัวเดียวกับแอปเก็บตังค์/ไร่ได้ หรือสร้างใหม่ที่ aistudio.google.com/apikey</p>`,
    `<button class="btn pri" onclick="saveGemini()">บันทึก</button>`);
}
function saveGemini() {
  const k = document.getElementById('gIn').value.trim();
  busy('กำลังเช็กรหัส…');
  api('setGeminiKey', [k]).then(r => { busy(false); if (r && r.ok) { D.gemini = true; closeSheet(); toast('✅ รหัสใช้ได้'); render(); } else alert('รหัสใช้ไม่ได้ (' + (r && r.code) + ')'); })
    .catch(e => { busy(false); handleErr(e); });
}
function openChangeKey() {
  openSheet('เปลี่ยนรหัสเข้าแอป', `<div class="fld"><label>รหัสใหม่ (อย่างน้อย 4 ตัว)</label><input class="inp" id="nkIn" autocomplete="new-password"></div>
    <p class="note">ทางลัด Xiaomi ต้องแก้ช่อง k เป็นรหัสใหม่ด้วย</p>`, `<button class="btn pri" onclick="changeKey()">เปลี่ยน</button>`);
}
function changeKey() {
  const k = document.getElementById('nkIn').value.trim();
  if (k.length < 4) return alert('รหัสสั้นเกินไป');
  busy('กำลังเปลี่ยน…');
  api('changeApiKey', [k]).then(() => { busy(false); lsSet(KEY_STORE, k); closeSheet(); toast('เปลี่ยนรหัสแล้ว'); }).catch(e => { busy(false); handleErr(e); });
}

// ===== เริ่ม =====
function load(force) {
  netErr = '';
  return api('getAll').then(d => { setData(d); }).catch(e => {
    if (e.auth) { render(); return showKeyBox(); }
    if (e.setup) { D = { needsSetup: true }; render(); return showSetup(); }
    netErr = e.message; render();
  });
}
// เช็กเวอร์ชันใหม่: iPhone จำหน้าเก่าได้ ~10 นาที → ดึงหน้าจริงแบบไม่ใช้แคช ถ้าเนื้อหาเปลี่ยนให้โหลดใหม่ (รอให้ส่งข้อมูลค้างเสร็จก่อน)
function checkUpdate() {
  if (location.protocol === 'file:') return;
  fetch(location.pathname + '?nc=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
    if (!t) return;
    let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0;
    const old = lsGet('lp_build'); lsSet('lp_build', String(h));
    if (old === String(h)) return;
    if (pending || syncing || syncQ.length || apiLive || W || tab === 'add' || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { lsSet('lp_build', old || ''); updWait = true; return; } // กำลังทำงานอยู่ → รอให้ว่างก่อนค่อยโหลดใหม่
    updWait = false;
    const q = new URLSearchParams(location.search); q.set('v', Date.now());
    location.replace(location.pathname + '?' + q.toString());
  }).catch(() => {});
}
(function init() {
  try { const ui = JSON.parse(lsGet(UI_STORE) || '{}'); if (ui.tab && Date.now() - ui.at < 30 * 60e3) tab = ui.tab; } catch (e) {}
  try { const c = JSON.parse(lsGet(DATA_STORE) || 'null'); if (c && c.log) { D = c; dDate = c.today; } } catch (e) {}
  // ลิงก์จากการแจ้งเตือน: ?if=start / ?if=end → เปิดการ์ด IF พร้อมตัวเลือกเวลา
  const ifq = (location.search.match(/[?&]if=(start|end)/) || [])[1];
  if (ifq) { tab = 'today'; ifMode = ifq; ifSel = selNow(); history.replaceState(null, '', location.pathname); setTimeout(() => { const el = document.getElementById('ifcard'); if (el) el.scrollIntoView({ block: 'center' }); }, 400); }
  render();
  load();
  checkUpdate();
  if (tab === 'coach') scrollChat();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D && !pending && !syncing && !syncQ.length) { load(); checkUpdate(); } });
})();
</script>
