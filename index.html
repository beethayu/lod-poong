<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- กฎ iOS 26 (จากแอปไร่อ้อย ห้ามเปลี่ยนกลับ): status-bar-style = default, ห้ามมีกล่องเลื่อนได้ใต้แถบสถานะ, ปุ่ม color: inherit -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ลดพุง">
  <meta name="theme-color" content="#1E4D45">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>ลดพุง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #1E4D45; --brand-d: #143630; --brand-soft: #E2EEEA;
      --ground: #F3F4F1; --card: #FFFFFF; --line: #E1E3DD; --line2: #CDD0C8;
      --ink: #1B2224; --muted: #5B6466; --faint: #8A9294;
      --ok: #1E7B4D; --warn: #A85E00; --warn-soft: #FDF0DC; --red: #B3261E; --red-soft: #FBE5E3;
      --c-pro: #2a78d6; --c-carb: #c98a00; --c-fat: #eb6834; --c-w: #2a78d6; --c-f: #eb6834;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: #1E4D45; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; background: var(--ground); height: 100%; overflow: hidden; overscroll-behavior: none;
      font-family: 'IBM Plex Sans Thai', 'Sarabun', system-ui, sans-serif; color: var(--ink); font-size: 16px; line-height: 1.45; }
    #sbar { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #1E4D45; z-index: 3000; pointer-events: none; }
    #app { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; overscroll-behavior: none; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
    #app.chat { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
    button { color: inherit; font-family: inherit; font-size: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px; }

    /* หัว */
    .hd { background: var(--brand); color: #fff; padding: 10px 14px 14px; }
    .hd-in { max-width: 560px; margin: 0 auto; }
    .hd-top { display: flex; align-items: center; gap: 8px; min-height: 36px; }
    .hd-title { font-weight: 700; font-size: 19px; flex: 1; }
    .hd-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,.12); flex: none; }
    .hd-sub { opacity: .8; font-size: 13px; }
    .dnav { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; }
    .dnav b { min-width: 120px; text-align: center; font-weight: 600; }
    .tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .tri > div { background: rgba(255,255,255,.1); border-radius: 12px; padding: 8px 10px; }
    .tri small { display: block; opacity: .8; font-size: 12px; }
    .tri b { font-size: 17px; }
    .seg-dk { display: flex; background: rgba(255,255,255,.12); border-radius: 12px; padding: 3px; gap: 3px; margin-top: 10px; }
    .seg-dk button { flex: 1; height: 36px; border-radius: 9px; font-weight: 600; color: rgba(255,255,255,.85); font-size: 15px; }
    .seg-dk button.on { background: #fff; color: var(--brand); }

    /* วงแหวน */
    .ringbox { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
    .ring { width: 150px; height: 150px; flex: none; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .ring .c b { font-size: 32px; line-height: 1.05; letter-spacing: -.5px; }
    .ring .c small { font-size: 13px; opacity: .85; }
    .eq { flex: 1; font-size: 14px; }
    .eq div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.14); }
    .eq div:last-child { border-bottom: 0; font-weight: 600; }
    .eq span { opacity: .85; }

    /* การ์ด / แถว */
    .sec { margin: 16px 0 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .sec h3 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
    .sec .sm { font-size: 14px; color: var(--muted); font-weight: 600; }
    .lnk { color: var(--brand); font-size: 14px; font-weight: 600; text-decoration: none; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .card.pad { padding: 12px 14px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); width: 100%; text-align: left; min-height: 50px; }
    .row:first-child { border-top: 0; }
    .ico { width: 34px; height: 34px; border-radius: 10px; background: var(--ground); display: grid; place-items: center; font-size: 18px; flex: none; }
    .grow { flex: 1; min-width: 0; }
    .t1 { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t1 small { color: var(--muted); font-weight: 400; font-size: 14px; }
    .t2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .amt { font-weight: 600; white-space: nowrap; text-align: right; }
    .amt small { font-weight: 400; color: var(--muted); font-size: 13px; }
    .empty { padding: 18px 14px; text-align: center; color: var(--muted); font-size: 14px; }
    .acts { display: flex; gap: 8px; padding: 0 12px 12px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 12px;
      font-weight: 600; background: var(--ground); border: 1px solid var(--line); }
    .btn.pri { background: var(--brand); color: #fff; border-color: var(--brand); }
    .btn.red { color: var(--red); background: #fff; }
    .btn.sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
    .btn.full { width: 100%; }
    .btn:disabled { opacity: .55; }
    .mbar { padding: 10px 14px; border-top: 1px solid var(--line); }
    .mbar:first-child { border-top: 0; }
    .mbar .l { display: flex; justify-content: space-between; font-size: 14px; }
    .mbar .l span { color: var(--muted); }
    .bar { height: 8px; background: var(--ground); border-radius: 99px; overflow: hidden; margin-top: 5px; }
    .bar > i { display: block; height: 100%; border-radius: 99px; }
    .alert { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
    .alert.warn { background: var(--warn-soft); color: #6B3C00; }
    .alert.red { background: var(--red-soft); color: var(--red); }
    .alert.info { background: var(--brand-soft); color: var(--brand-d); }
    .tip { display: flex; gap: 10px; padding: 12px 14px; }
    .tip .tx { flex: 1; font-size: 15px; white-space: pre-wrap; }
    .tip .tx.mut { color: var(--muted); }
    .water { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
    .glasses { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .glasses i { width: 14px; height: 18px; border-radius: 2px 2px 4px 4px; border: 1.5px solid #8fb8d8; display: block; }
    .glasses i.on { background: #6fa8d6; border-color: #6fa8d6; }
    .wbtn { width: 46px; height: 46px; border-radius: 12px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 700; flex: none; }
    .wbtn.alt { background: var(--ground); color: var(--muted); border: 1px solid var(--line); width: 38px; }
    .big { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
    .up { color: var(--red); } .down { color: var(--ok); }
    .note { font-size: 13px; color: var(--muted); }

    /* แถบล่าง */
    .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: #fff; border-top: 1px solid var(--line);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); }
    .bnav button { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11.5px; color: var(--faint); padding: 4px 0; }
    .bnav button span { font-size: 21px; line-height: 1.2; filter: grayscale(1); opacity: .75; }
    .bnav button.on { color: var(--brand); font-weight: 600; }
    .bnav button.on span { filter: none; opacity: 1; }
    body.kb .bnav { display: none; }

    /* หน้าต่าง */
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top); z-index: 2000; background: var(--ground); display: none; flex-direction: column; }
    .sheet.on { display: flex; }
    .sh-hd { background: var(--brand); color: #fff; display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex: none; }
    .sh-hd b { flex: 1; font-size: 17px; }
    .sh-bd { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px 14px calc(24px + env(safe-area-inset-bottom)); }
    .sh-bd > * { max-width: 560px; margin-left: auto; margin-right: auto; }
    .sh-ft { flex: none; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); display: flex; gap: 8px; }
    .sh-ft .btn { flex: 1; }

    /* ฟอร์ม */
    .fld { margin-bottom: 12px; }
    .fld > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .inp { width: 100%; height: 44px; border: 1px solid var(--line2); border-radius: 10px; padding: 0 12px; background: #fff; }
    textarea.inp { height: 80px; padding: 10px 12px; }
    .flbl { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 2px 6px; }
    .fcard .frow { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-top: 1px solid var(--line); }
    .fcard .frow:first-child { border-top: 0; }
    .fcard .frow > span { width: 104px; flex: none; color: var(--muted); font-size: 15px; }
    .fcard .frow input { flex: 1; min-width: 0; border: 0; outline: 0; height: 48px; background: transparent; text-align: right; padding: 0; }
    .fcard .frow .sfx { width: auto; color: var(--muted); font-size: 14px; flex: none; }
    .fcard .frow.chk input { flex: none; width: 24px; height: 24px; accent-color: var(--brand); }
    .fcard .frow.chk > span { width: auto; flex: 1; color: var(--ink); }
    .fcard .frow.chk small { display: block; color: var(--muted); font-size: 12.5px; }
    .fcard .frow.tall { display: block; padding: 10px 14px; }
    .fcard .frow.tall > span { display: block; width: auto; margin-bottom: 6px; }
    .fcard textarea { width: 100%; border: 0; outline: 0; background: transparent; resize: none; height: 70px; padding: 0; }
    /* iOS: ช่องวันที่มีความกว้างขั้นต่ำของมันเอง → บังคับให้พอดีช่อง */
    input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; display: block; background: transparent; }
    input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value { text-align: right; }
    .amtbox { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border-radius: 14px; height: 72px; padding: 0 16px; margin-top: 12px; }
    .amtbox input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 38px; font-weight: 700; text-align: right; height: 100%; padding: 0; color: #fff; }
    .amtbox input::placeholder { color: rgba(255,255,255,.45); }
    .amtbox span { font-size: 18px; color: rgba(255,255,255,.75); font-weight: 600; }
    .hscroll { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 2px; }
    .hscroll::-webkit-scrollbar { display: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line2); background: #fff; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; flex: none; white-space: nowrap; }
    .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .hd .chip { background: rgba(255,255,255,.12); border-color: transparent; color: #fff; }
    .hd .chip.on { background: #fff; color: var(--brand); }
    .seg { display: flex; background: #E6E8E3; border-radius: 12px; padding: 3px; gap: 3px; }
    .seg button { flex: 1; height: 36px; border-radius: 9px; font-weight: 600; color: var(--muted); font-size: 15px; }
    .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .preview { padding: 12px 14px; border-top: 1px solid var(--line); font-size: 14px; background: var(--brand-soft); color: var(--brand-d); }
    .preview b { font-size: 16px; }
    .preview.bad { background: var(--warn-soft); color: #6B3C00; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tbl th, .tbl td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
    .tbl th { color: var(--muted); font-weight: 600; border-top: 0; font-size: 12.5px; }
    .tbl th:first-child, .tbl td:first-child { text-align: left; }
    .steps { padding-left: 20px; margin: 6px 0; font-size: 15px; }
    .steps li { margin-bottom: 8px; }
    .code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; word-break: break-all; display: block; margin: 4px 0; }

    /* แชต */
    .msgs { padding: 12px 0 8px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 86%; padding: 9px 13px; border-radius: 16px; font-size: 15.5px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.u { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 5px; }
    .msg.m { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .msg.wait { color: var(--muted); }
    .msg .ph { font-size: 13px; opacity: .85; display: block; }
    .msg .at { display: block; font-size: 11px; opacity: .6; margin-top: 2px; text-align: right; }
    .ecard { align-self: flex-start; width: 86%; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .ecard .eh { font-size: 12.5px; color: var(--muted); padding: 8px 12px 0; font-weight: 600; }
    .ecard .row { min-height: 44px; padding: 7px 12px; }
    .ecard.off { opacity: .55; }
    .ecard.off .t1 { text-decoration: line-through; }
    .ecard .acts { padding-top: 4px; }
    .compose { position: fixed; left: 0; right: 0; z-index: 1100; background: #fff; border-top: 1px solid var(--line);
      bottom: calc(62px + env(safe-area-inset-bottom)); padding: 8px 10px; }
    body.kb .compose { bottom: var(--kb, 0px); }
    .compose .in { max-width: 560px; margin: 0 auto; display: flex; align-items: flex-end; gap: 6px; }
    .compose textarea { flex: 1; min-width: 0; border: 1px solid var(--line2); border-radius: 20px; padding: 9px 14px; resize: none; height: 42px; max-height: 120px; outline: 0; line-height: 1.4; }
    .cbtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--ground); cursor: pointer; }
    .cbtn.send { background: var(--brand); color: #fff; }
    .thumbs { max-width: 560px; margin: 0 auto 6px; display: flex; gap: 6px; }
    .thumbs div { position: relative; }
    .thumbs img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; display: block; }
    .thumbs button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #333; color: #fff; font-size: 12px; }
    .photo { width: 100%; max-height: 70vh; object-fit: contain; background: #222; border-radius: 12px; display: block; }

    /* กราฟ */
    .chart { padding: 10px 8px 6px; }
    .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 0 6px 4px; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 4px; }
    .legend i.dot { width: 8px; height: 8px; border-radius: 50%; vertical-align: 0; }
    .ctip { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 2px; text-align: center; }
    .ctip b { color: var(--ink); }
    svg text { font-family: inherit; }
    .stat3 { display: grid; grid-template-columns: repeat(3, 1fr); }
    .stat3 > div { padding: 10px 12px; border-left: 1px solid var(--line); }
    .stat3 > div:first-child { border-left: 0; }
    .stat3 small { display: block; color: var(--muted); font-size: 12px; }
    .stat3 b { font-size: 17px; }

    #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); background: #1B2224; color: #fff;
      padding: 9px 18px; border-radius: 99px; font-size: 15px; z-index: 4000; display: none; max-width: 90%; text-align: center; }
    #busy { position: fixed; inset: 0; background: rgba(15,30,28,.55); z-index: 3500; display: none; place-items: center; }
    #busy div { background: #fff; border-radius: 16px; padding: 18px 22px; text-align: center; max-width: 280px; }
    .spin { width: 34px; height: 34px; border: 4px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: sp 0.8s linear infinite; margin: 0 auto 10px; }
    .spin.sm { width: 16px; height: 16px; border-width: 2px; margin: 0; display: inline-block; vertical-align: -3px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .netbar { background: var(--warn-soft); color: #6B3C00; font-size: 14px; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
<div id="sbar"></div>
<div id="app"></div>
<div class="compose" id="compose" style="display:none">
  <div class="thumbs" id="thumbs"></div>
  <div class="in">
    <label class="cbtn" for="photoFile">📷</label>
    <textarea id="cmsg" rows="1" placeholder="กินอะไร ชั่งได้เท่าไร หรือถามโค้ช…" oninput="growTa(this)"></textarea>
    <button class="cbtn send" id="sendBtn" onclick="sendChat()">➤</button>
  </div>
</div>
<nav class="bnav" id="bnav">
  <button data-t="today" onclick="go('today')"><span>🏠</span>วันนี้</button>
  <button data-t="diary" onclick="go('diary')"><span>📒</span>ไดอารี่</button>
  <button data-t="coach" onclick="go('coach')"><span>💬</span>โค้ช</button>
  <button data-t="train" onclick="go('train')"><span>🏋️</span>ฝึก</button>
  <button data-t="sum" onclick="go('sum')"><span>📊</span>สรุป</button>
</nav>
<div class="sheet" id="sheet"><div class="sh-hd"><b id="shTitle"></b><button class="hd-btn" onclick="closeSheet()">✕</button></div>
  <div class="sh-bd" id="shBody"></div><div class="sh-ft" id="shFoot" style="display:none"></div></div>
<div id="busy"><div><div class="spin"></div><div id="busyMsg">กำลังโหลด…</div></div></div>
<div id="toast"></div>
<input type="file" id="photoFile" accept="image/*" multiple style="position:fixed;left:-9999px;opacity:0;width:1px;height:1px" onchange="onPhoto(this)">

<script>
// ===== เชื่อมกับ Apps Script =====
const API_URL = 'https://script.google.com/macros/s/AKfycbzh7rtLdGZsLiAxsb4vaAZrMLoRUB5jLt27X9tYF2GRJSmtFwJe61v-JlTqsIXpMc6y/exec';
const KEY_STORE = 'lp_key', DATA_STORE = 'lp_data', UI_STORE = 'lp_ui';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
(function () {
  const m = location.search.match(/[?&]k=([^&]+)/);
  if (m) { lsSet(KEY_STORE, decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.hash); }
})();

function api(fn, args) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), fn === 'coachSend' || fn === 'getTip' ? 150000 : 60000);
  return fetch(API_URL, {
    method: 'POST', redirect: 'follow', signal: ctrl.signal,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], k: lsGet(KEY_STORE) || '' })
  })
    .catch(e => { throw new Error(e.name === 'AbortError' ? 'หมดเวลาเชื่อมต่อ สัญญาณอาจอ่อน ลองใหม่' : 'เชื่อมต่อไม่ได้ ตรวจสอบเน็ต'); })

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = x => { const n = Number(String(x == null ? '' : x).replace(/,/g, '')); return isFinite(n) ? n : 0; };

function todayIso() { return D && D.today ? D.today : isoOf(new Date()); }
function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(iso, k) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + k); return isoOf(d); }
function dayDiff(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }
function thDate(iso, withDay) {

function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function mealOf(hm) {

function totals(list) {

  list.forEach(l => {
    if (l.kind === 'food') { t.kcal += num(l.kcal); t.protein += num(l.protein); t.carb += num(l.carb); t.fat += num(l.fat); t.n++; }

function dailyWeights() {
  const m = {};
  weights().forEach(w => { m[w.date] = { date: w.date, w: num(w.weight), f: num(w.fat_pct) || 0 }; });
  return Object.values(m).sort((a, b) => a.date < b.date ? -1 : 1);
}
function latestW() {
  const ws = weights(); if (!ws.length) return null;
  const last = ws[ws.length - 1], lf = ws.filter(w => num(w.fat_pct) > 0).pop();
  return { date: last.date, weight: num(last.weight), fat_pct: lf ? num(lf.fat_pct) : 0, muscle: num(last.muscle) };
}

// ===== คำนวณเป้า (ตรงกับ calcTarget_ ใน GAS) =====
function calcTarget(s, lw) {
  lw = lw || latestW() || { weight: 100, fat_pct: 0 };
  const w = lw.weight, f = lw.fat_pct;
  const bmr = f > 0 ? 370 + 21.6 * w * (1 - f / 100) : 10 * w + 6.25 * num(s.height || 170) - 5 * (num(s.age) || 40) + (s.sex === 'female' ? -161 : 5);
  const tdee = bmr * (num(s.activity) || 1.2);
  const rate = num(s.rate) || 2;
  let kcal = tdee - rate * 7700 / 30;
  const low = kcal < bmr;
  if (low) kcal = bmr;
  kcal = Math.round(kcal / 10) * 10;
  const lbm = f > 0 ? w * (1 - f / 100) : num(s.goal_weight || w) * 0.75;
  let protein = Math.round(lbm * 2), fat = Math.round(kcal * 0.25 / 9);
  let carb = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  const auto = { kcal, protein, carb, fat };
  if (!isTrue(s.macro_auto)) { kcal = num(s.kcal) || kcal; protein = num(s.protein) || protein; carb = num(s.carb) || carb; fat = num(s.fat) || fat; }
  // ถึงเป้าเมื่อไร (คิดจากที่ขาดจริงต่อวัน)
  const deficit = tdee - kcal, toLose = w - num(s.goal_weight);
  const days = deficit > 0 && toLose > 0 ? Math.round(toLose * 7700 / deficit) : 0;
  return { kcal, protein, carb, fat, auto, bmr: Math.round(bmr), tdee: Math.round(tdee), low, weight: w, fat_pct: f, deficit: Math.round(deficit), days, toLose: r1(toLose) };
}

function alertsHtml(tg) {

  if (dw.length >= 4 && dayDiff(dw[0].date, td) >= 24) {
    const avg = (a, b) => { const x = dw.filter(w => w.date > a && w.date <= b); return x.length ? x.reduce((s, w) => s + w.w, 0) / x.length : null; };
    const now = avg(addDays(td, -7), td), then = avg(addDays(td, -28), addDays(td, -21));
    if (now != null && then != null && then - now < 0.3) out.push(`<div class="alert warn">⚖️ น้ำหนักแทบไม่ลง 3 อาทิตย์ (${r1(then)} → ${r1(now)}) — ลองลดวันละ ~150 แคล หรือเดินเพิ่มวันละ 20–30 นาที</div>`);
  }
  // กินต่ำกว่าเป้ามากหลายวัน
  let low = 0, seen = 0;
  for (let i = 1; i <= 4; i++) { const t = totals(dayLogs(addDays(td, -i))); if (t.n) { seen++; if (t.kcal < tg.kcal - 500) low++; } }
  if (seen >= 3 && low >= 3) out.push(`<div class="alert red">🍽️ ${low} วันล่าสุดกินต่ำกว่าเป้าเกิน 500 แคล — กินให้พอเป้า ไม่งั้นกล้ามหายและเผาผลาญลดลง</div>`);

  return out.join('');
}

function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('เปิดรูปไม่ได้')); };
    img.src = url;
  });
}

        ${wk.map(w => `<tr><td>${thDate(w.a).replace(/ \d+$/, '')}${w.a === mon ? ' (นี้)' : ''}</td><td>${w.n ? fmt(w.kcal) : '-'}</td><td>${w.n ? fmt(w.pro) + ' ก.' : '-'}</td><td>${w.w ? r1(w.w) : '-'}</td></tr>`).join('')}</table></div>

const CH = {};
function lineChart(id, pts, key, color, dotColor, goal) {
  if (!pts.length) return '<div class="empty">ยังไม่มีข้อมูล</div>';
  const W = 360, H = 190, L = 34, R = 10, T = 10, B = 24;
  const t0 = new Date(pts[0].date + 'T12:00:00').getTime(), t1 = new Date(pts[pts.length - 1].date + 'T12:00:00').getTime();
  const span = Math.max(1, t1 - t0);
  // เฉลี่ย 7 วัน (ย้อนหลังตามวันที่)
  const avg = pts.map(p => { const a = addDays(p.date, -6), x = pts.filter(q => q.date >= a && q.date <= p.date); return x.reduce((s, q) => s + q[key], 0) / x.length; });
  let lo = Math.min(...pts.map(p => p[key])), hi = Math.max(...pts.map(p => p[key]));
  if (goal && goal > lo - 3) lo = Math.min(lo, goal);
  if (hi - lo < 2) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const X = d => L + (pts.length === 1 ? (W - L - R) / 2 : (new Date(d + 'T12:00:00').getTime() - t0) / span * (W - L - R));
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = (hi - lo) / 4;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = lo + step * i; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6E8E3"/><text x="${L - 5}" y="${Y(v) + 4}" font-size="10.5" text-anchor="end" fill="#8A9294">${r1(v)}</text>`; }
  const ticks = [pts[0], pts[Math.floor(pts.length / 2)], pts[pts.length - 1]].filter((p, i, a) => a.indexOf(p) === i);
  g += ticks.map((p, i) => `<text x="${X(p.date)}" y="${H - 6}" font-size="10.5" text-anchor="${pts.length === 1 ? 'middle' : i === 0 ? 'start' : i === ticks.length - 1 ? 'end' : 'middle'}" fill="#8A9294">${thDate(p.date).replace(/ \d+$/, '')}</text>`).join('');
  if (goal && goal >= lo && goal <= hi) g += `<line x1="${L}" x2="${W - R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#5B6466" stroke-dasharray="4 4"/>`;
  g += pts.map(p => `<circle cx="${X(p.date)}" cy="${Y(p[key])}" r="2.8" fill="${dotColor}"/>`).join('');
  if (pts.length > 1) g += `<polyline points="${pts.map((p, i) => X(p.date).toFixed(1) + ',' + Y(avg[i]).toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  CH[id] = { pts, avg, key, X, L, W, R };
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;touch-action:pan-y" onpointerdown="chTip('${id}',event)" onpointermove="chTip('${id}',event)">${g}<line id="${id}_cur" y1="${T}" y2="${H - B}" stroke="#1B2224" stroke-width="1" style="display:none"/></svg>`;
}
function chTip(id, ev) {
  const c = CH[id]; if (!c) return;
  const svg = ev.currentTarget, rect = svg.getBoundingClientRect(), x = (ev.clientX - rect.left) / rect.width * c.W;
  let bi = 0, bd = 1e9; c.pts.forEach((p, i) => { const d = Math.abs(c.X(p.date) - x); if (d < bd) { bd = d; bi = i; } });
  const p = c.pts[bi], cur = document.getElementById(id + '_cur');
  cur.setAttribute('x1', c.X(p.date)); cur.setAttribute('x2', c.X(p.date)); cur.style.display = '';
  document.getElementById(id + '_tip').innerHTML = `<b>${thDate(p.date, true)}</b> · ${p[c.key]}${c.key === 'f' ? '%' : ' กก.'} · เฉลี่ย 7 วัน <b>${r1(c.avg[bi])}</b>`;
}
function kcalChart(days, tg) {
  const W = 360, H = 170, L = 34, R = 6, T = 10, B = 22;
  const hi = Math.max(tg.kcal * 1.3, ...days.map(d => d.kcal)) || 2000;
  const bw = (W - L - R) / days.length;
  const Y = v => T + (1 - v / hi) * (H - T - B);
  let g = '';
  [0, 0.5, 1].forEach(f => { const v = Math.round(hi * f / 100) * 100; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6E8E3"/><text x="${L - 5}" y="${Y(v) + 4}" font-size="10.5" text-anchor="end" fill="#8A9294">${v >= 1000 ? r1(v / 1000) + 'k' : v}</text>`; });
  days.forEach((d, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64, budget = tg.kcal + d.ex / 2, h = Y(0) - Y(d.kcal);
    const col = !d.kcal ? '#E6E8E3' : d.kcal > budget + 100 ? 'var(--c-fat)' : 'var(--c-pro)';
    g += `<rect x="${x.toFixed(1)}" y="${(Y(0) - Math.max(h, 2)).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h, 2).toFixed(1)}" rx="3" fill="${col}"/>
      <rect x="${(L + i * bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${H - T - B}" fill="transparent" onclick="kTip(${i})"/>`;
    if (i % 2 === 1 || i === days.length - 1) g += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#8A9294">${new Date(d.d + 'T12:00:00').getDate()}</text>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${Y(tg.kcal)}" y2="${Y(tg.kcal)}" stroke="#1B2224" stroke-dasharray="4 4"/>`;
  CH.k = days;
  return `<div class="legend"><span><i class="dot" style="background:var(--c-pro);border-radius:2px"></i>ไม่เกินเป้า</span><span><i class="dot" style="background:var(--c-fat);border-radius:2px"></i>เกินเป้า</span><span><i style="height:0;border-top:2px dashed #1B2224"></i>เป้า</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`;
}
function kTip(i) { const d = CH.k[i]; document.getElementById('ck_tip').innerHTML = `<b>${thDate(d.d, true)}</b> · กิน ${fmt(d.kcal)} · โปรตีน ${fmt(d.protein)} ก.${d.ex ? ' · ออกกำลัง ' + fmt(d.ex) : ''}`; }

function openGemini() {
  openSheet('รหัส Gemini', `<div class="fld"><label>วางรหัส (ขึ้นต้น AQ. หรือ AIza)</label><input class="inp" id="gIn"></div>
    <p class="note">ตัวเดียวกับแอปเก็บตังค์/ไร่ได้ หรือสร้างใหม่ที่ aistudio.google.com/apikey</p>`,
    `<button class="btn pri" onclick="saveGemini()">บันทึก</button>`);
}
function saveGemini() {
  const k = document.getElementById('gIn').value.trim();
  busy('กำลังเช็กรหัส…');
  api('setGeminiKey', [k]).then(r => { busy(false); if (r && r.ok) { D.gemini = true; closeSheet(); toast('✅ รหัสใช้ได้'); render(); } else alert('รหัสใช้ไม่ได้ (' + (r && r.code) + ')'); })
    .catch(e => { busy(false); handleErr(e); });
}
function openChangeKey() {
  openSheet('เปลี่ยนรหัสเข้าแอป', `<div class="fld"><label>รหัสใหม่ (อย่างน้อย 4 ตัว)</label><input class="inp" id="nkIn" autocomplete="new-password"></div>
    <p class="note">ทางลัด Xiaomi ต้องแก้ช่อง k เป็นรหัสใหม่ด้วย</p>`, `<button class="btn pri" onclick="changeKey()">เปลี่ยน</button>`);
}
function changeKey() {
  const k = document.getElementById('nkIn').value.trim();
  if (k.length < 4) return alert('รหัสสั้นเกินไป');
  busy('กำลังเปลี่ยน…');
  api('changeApiKey', [k]).then(() => { busy(false); lsSet(KEY_STORE, k); closeSheet(); toast('เปลี่ยนรหัสแล้ว'); }).catch(e => { busy(false); handleErr(e); });
}

// ===== เริ่ม =====
function load(force) {
  netErr = '';
  return api('getAll').then(d => { setData(d); }).catch(e => {
    if (e.auth) { render(); return showKeyBox(); }
    if (e.setup) { D = { needsSetup: true }; render(); return showSetup(); }
    netErr = e.message; render();
  });
}
(function init() {
  try { const ui = JSON.parse(lsGet(UI_STORE) || '{}'); if (ui.tab && Date.now() - ui.at < 30 * 60e3) tab = ui.tab; } catch (e) {}
  try { const c = JSON.parse(lsGet(DATA_STORE) || 'null'); if (c && c.log) { D = c; dDate = c.today; } } catch (e) {}
  render();
  load();
  if (tab === 'coach') scrollChat();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D && !pending) load(); });
})();
</script>
</body>
</html>
